<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="45%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="45%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
      <animate attributeName="x1" values="0;1;0" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.4"/></filter>
  </defs>

  <rect x="2" y="2" width="996" height="296" rx="24" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
  <rect x="2" y="2" width="996" height="296" rx="24" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.75">
    <animate attributeName="opacity" values="0.45;0.9;0.45" dur="4s" repeatCount="indefinite"/>
  </rect>

  <circle cx="760" cy="70" r="150" fill="url(#glow)" filter="url(#blur)">
    <animate attributeName="cx" values="760;840;760" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="230" r="110" fill="#14b8a6" opacity="0.12" filter="url(#blur)">
    <animate attributeName="cy" values="230;185;230" dur="6s" repeatCount="indefinite"/>
  </circle>

  <text x="48" y="66" fill="#f8fafc" font-size="32" font-family="Segoe UI, Inter, Arial, sans-serif" font-weight="700">Valorahub</text>
  <rect x="48" y="84" width="116" height="28" rx="14" fill="#7c3aed" fill-opacity="0.2" stroke="#8b5cf6" stroke-opacity="0.7"/>
  <text x="106" y="103" text-anchor="middle" fill="#c4b5fd" font-size="12" font-family="Segoe UI, Inter, Arial, sans-serif" font-weight="700">PRIVATE PROJECT</text>

  <text x="48" y="146" fill="#cbd5e1" font-size="18" font-family="Segoe UI, Inter, Arial, sans-serif">A modern VALORANT cosmetics explorer focused on speed, visuals,</text>
  <text x="48" y="174" fill="#cbd5e1" font-size="18" font-family="Segoe UI, Inter, Arial, sans-serif">video previews, agents, contracts, cosmetics and a polished UI.</text>

  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="600">
    <rect x="48" y="218" width="94" height="30" rx="9" fill="#161b22" stroke="#30363d"/>
    <text x="95" y="238" text-anchor="middle" fill="#facc15">JavaScript</text>
    <rect x="152" y="218" width="72" height="30" rx="9" fill="#161b22" stroke="#30363d"/>
    <text x="188" y="238" text-anchor="middle" fill="#60a5fa">HTML</text>
    <rect x="234" y="218" width="62" height="30" rx="9" fill="#161b22" stroke="#30363d"/>
    <text x="265" y="238" text-anchor="middle" fill="#38bdf8">CSS</text>
    <rect x="306" y="218" width="86" height="30" rx="9" fill="#161b22" stroke="#30363d"/>
    <text x="349" y="238" text-anchor="middle" fill="#a78bfa">REST API</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="610" y="52" width="334" height="194" rx="18" fill="#0b1020" stroke="#334155"/>
    <rect x="626" y="68" width="302" height="24" rx="8" fill="#111827"/>
    <circle cx="642" cy="80" r="4" fill="#ef4444"/>
    <circle cx="656" cy="80" r="4" fill="#f59e0b"/>
    <circle cx="670" cy="80" r="4" fill="#22c55e"/>
    <rect x="626" y="108" width="104" height="122" rx="12" fill="#111827" stroke="#1f2937"/>
    <rect x="742" y="108" width="186" height="54" rx="12" fill="#151b2d" stroke="#24314a"/>
    <rect x="742" y="174" width="88" height="56" rx="12" fill="#111827" stroke="#1f2937"/>
    <rect x="840" y="174" width="88" height="56" rx="12" fill="#111827" stroke="#1f2937"/>
    <rect x="640" y="122" width="76" height="10" rx="5" fill="#334155"/>
    <rect x="640" y="142" width="58" height="8" rx="4" fill="#1f2937"/>
    <rect x="758" y="124" width="128" height="10" rx="5" fill="url(#accent)"/>
    <rect x="758" y="144" width="92" height="8" rx="4" fill="#334155"/>
    <circle cx="786" cy="202" r="15" fill="#14b8a6" fill-opacity="0.25" stroke="#14b8a6"/>
    <circle cx="884" cy="202" r="15" fill="#8b5cf6" fill-opacity="0.25" stroke="#8b5cf6"/>
  </g>

  <rect x="595" y="42" width="360" height="214" rx="24" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.25">
    <animate attributeName="opacity" values="0.15;0.55;0.15" dur="3.8s" repeatCount="indefinite"/>
  </rect>
</svg>
