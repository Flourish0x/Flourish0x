<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Vaulted private project card</title>
  <desc id="desc">A modern dark project card for Vaulted marked as a private project.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071225"/>
      <stop offset="0.52" stop-color="#0B1430"/>
      <stop offset="1" stop-color="#0E182B"/>
    </linearGradient>

    <linearGradient id="stroke" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6"/>
      <stop offset="0.55" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>

    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#312E81"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>

    <linearGradient id="previewBorder" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>

    <filter id="shadow" x="-30" y="-30" width="1260" height="400" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="8" y="8" width="1184" height="324" rx="28" fill="url(#bg)"/>
    <rect x="8.8" y="8.8" width="1182.4" height="322.4" rx="27.2" stroke="url(#stroke)" stroke-width="1.6"/>
  </g>

  <!-- Left content -->
  <text x="52" y="82" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="700">Vaulted</text>

  <rect x="52" y="108" width="138" height="34" rx="17" fill="url(#badge)" stroke="#8B5CF6" stroke-opacity="0.6"/>
  <text x="68" y="131" fill="#E9D5FF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">PRIVATE PROJECT</text>

  <text x="52" y="184" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22">
    <tspan x="52" dy="0">A modern music library and player project focused on playlists,</tspan>
    <tspan x="52" dy="34">profiles, audio tools, accounts, customization and a polished UI.</tspan>
  </text>

  <!-- Tech pills -->
  <rect x="52" y="260" width="88" height="38" rx="12" fill="#121C2D" stroke="#2B3648"/>
  <text x="73" y="285" fill="#F472B6" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Swift</text>

  <rect x="150" y="260" width="98" height="38" rx="12" fill="#121C2D" stroke="#2B3648"/>
  <text x="171" y="285" fill="#86EFAC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Node.js</text>

  <rect x="258" y="260" width="110" height="38" rx="12" fill="#121C2D" stroke="#2B3648"/>
  <text x="279" y="285" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">MongoDB</text>

  <rect x="378" y="260" width="86" height="38" rx="12" fill="#121C2D" stroke="#2B3648"/>
  <text x="404" y="285" fill="#A78BFA" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">REST API</text>

  <!-- Right preview window -->
  <rect x="706" y="54" width="434" height="212" rx="28" fill="#0B1020" stroke="url(#previewBorder)" stroke-width="2"/>
  <rect x="724" y="70" width="398" height="176" rx="22" fill="#0B1325" stroke="#263246"/>

  <!-- top bar -->
  <rect x="742" y="88" width="362" height="26" rx="10" fill="#101A30"/>
  <circle cx="763" cy="101" r="5" fill="#EF4444"/>
  <circle cx="781" cy="101" r="5" fill="#F59E0B"/>
  <circle cx="799" cy="101" r="5" fill="#22C55E"/>

  <!-- sidebar -->
  <rect x="742" y="132" width="124" height="98" rx="16" fill="#0D1730" stroke="#22304A"/>
  <rect x="758" y="148" width="74" height="14" rx="7" fill="#334155"/>
  <rect x="758" y="170" width="56" height="10" rx="5" fill="#334155"/>

  <!-- center card -->
  <rect x="880" y="132" width="152" height="62" rx="16" fill="#151E35" stroke="#27324A"/>
  <rect x="900" y="149" width="100" height="12" rx="6" fill="#8B5CF6"/>
  <rect x="1000" y="149" width="12" height="12" rx="6" fill="#14B8A6"/>
  <rect x="900" y="169" width="74" height="10" rx="5" fill="#475569"/>

  <!-- bottom cards -->
  <rect x="880" y="208" width="74" height="48" rx="14" fill="#0F1D34" stroke="#22304A"/>
  <circle cx="917" cy="232" r="18" fill="#0F766E" fill-opacity="0.35" stroke="#14B8A6"/>
  <rect x="966" y="208" width="66" height="48" rx="14" fill="#0F1D34" stroke="#22304A"/>
  <circle cx="999" cy="232" r="18" fill="#4C1D95" fill-opacity="0.35" stroke="#8B5CF6"/>

  <!-- little music/player feel -->
  <rect x="1048" y="132" width="56" height="124" rx="16" fill="#111827" stroke="#22304A"/>
  <rect x="1062" y="150" width="28" height="6" rx="3" fill="#334155"/>
  <rect x="1072" y="170" width="8" height="42" rx="4" fill="#8B5CF6"/>
  <rect x="1062" y="220" width="28" height="10" rx="5" fill="#14B8A6" fill-opacity="0.8"/>
</svg>
