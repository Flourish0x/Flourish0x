<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Vaulted private project card</title>
  <desc id="desc">A modern animated dark project card for Vaulted marked as a private project.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#081225"/>
      <stop offset="0.52" stop-color="#0A1230"/>
      <stop offset="1" stop-color="#0D182B"/>
    </linearGradient>

    <linearGradient id="stroke" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>

    <linearGradient id="badge" x1="0" y1="0" x2="138" y2="34" gradientUnits="userSpaceOnUse">
      <stop stop-color="#312E81"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>

    <filter id="shadow" x="-30" y="-30" width="1260" height="400" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.32"/>
    </filter>

    <filter id="glow" x="0" y="0" width="1200" height="340" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <!-- soft animated glows -->
  <circle cx="900" cy="70" r="120" fill="#8B5CF6" fill-opacity="0.18" filter="url(#glow)">
    <animate attributeName="opacity" values="0.55;0.9;0.55" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1080" cy="240" r="110" fill="#14B8A6" fill-opacity="0.14" filter="url(#glow)">
    <animate attributeName="opacity" values="0.45;0.8;0.45" dur="4.8s" repeatCount="indefinite"/>
  </circle>

  <g filter="url(#shadow)">
    <rect x="8" y="8" width="1184" height="324" rx="28" fill="url(#bg)"/>
    <rect x="8.8" y="8.8" width="1182.4" height="322.4" rx="27.2" stroke="url(#stroke)" stroke-width="1.6"/>
  </g>

  <!-- left side -->
  <text x="52" y="82" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="700">Vaulted</text>

  <rect x="52" y="108" width="138" height="34" rx="17" fill="url(#badge)" stroke="#8B5CF6" stroke-opacity="0.7"/>
  <text x="66" y="131" fill="#E9D5FF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">PRIVATE PROJECT</text>

  <text x="52" y="184" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22">
    <tspan x="52" dy="0">A modern music library and player project focused on playlists,</tspan>
    <tspan x="52" dy="34">profiles, audio tools, accounts, customization and a polished UI.</tspan>
  </text>

  <!-- pills -->
  <rect x="52" y="260" width="88" height="38" rx="12" fill="#121C2D" stroke="#2B3648"/>
  <text x="71" y="285" fill="#F472B6" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Swift</text>

  <rect x="150" y="260" width="98" height="38" rx="12" fill="#121C2D" stroke="#2B3648"/>
  <text x="171" y="285" fill="#86EFAC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Node.js</text>

  <rect x="258" y="260" width="110" height="38" rx="12" fill="#121C2D" stroke="#2B3648"/>
  <text x="279" y="285" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">MongoDB</text>

  <rect x="378" y="260" width="86" height="38" rx="12" fill="#121C2D" stroke="#2B3648"/>
  <text x="401" y="285" fill="#A78BFA" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">REST API</text>

  <!-- right preview box -->
  <rect x="706" y="54" width="434" height="212" rx="28" fill="#090E1D" stroke="url(#stroke)" stroke-width="2"/>
  <rect x="724" y="70" width="398" height="176" rx="22" fill="#0B1325" stroke="#243044"/>

  <!-- browser bar -->
  <rect x="742" y="88" width="362" height="26" rx="10" fill="#08142A"/>
  <circle cx="763" cy="101" r="5" fill="#EF4444"/>
  <circle cx="781" cy="101" r="5" fill="#F59E0B"/>
  <circle cx="799" cy="101" r="5" fill="#22C55E"/>

  <!-- left panel -->
  <rect x="742" y="132" width="124" height="98" rx="16" fill="#0A1730" stroke="#22304A"/>
  <rect x="758" y="148" width="74" height="14" rx="7" fill="#334155"/>
  <rect x="758" y="170" width="56" height="10" rx="5" fill="#334155"/>

  <!-- center top card -->
  <rect x="880" y="132" width="152" height="62" rx="16" fill="#151E35" stroke="#27324A"/>
  <rect x="900" y="149" width="98" height="12" rx="6" fill="#8B5CF6">
    <animate attributeName="width" values="70;110;70" dur="3.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="1000" y="149" width="12" height="12" rx="6" fill="#14B8A6"/>
  <rect x="900" y="169" width="74" height="10" rx="5" fill="#475569"/>

  <!-- bottom mini cards -->
  <rect x="880" y="208" width="74" height="48" rx="14" fill="#0F1D34" stroke="#22304A"/>
  <circle cx="917" cy="232" r="18" fill="#0F766E" fill-opacity="0.35" stroke="#14B8A6">
    <animate attributeName="r" values="16;18;16" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <rect x="966" y="208" width="66" height="48" rx="14" fill="#0F1D34" stroke="#22304A"/>
  <circle cx="999" cy="232" r="18" fill="#4C1D95" fill-opacity="0.35" stroke="#8B5CF6">
    <animate attributeName="r" values="16;18;16" dur="3.1s" repeatCount="indefinite"/>
  </circle>

  <!-- right slim music card -->
  <rect x="1048" y="132" width="56" height="124" rx="16" fill="#111827" stroke="#22304A"/>
  <rect x="1062" y="146" width="28" height="6" rx="3" fill="#334155"/>
  <rect x="1071" y="170" width="10" height="42" rx="5" fill="#8B5CF6">
    <animate attributeName="height" values="30;46;30" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="y" values="176;168;176" dur="2.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="1062" y="220" width="28" height="10" rx="5" fill="#14B8A6" fill-opacity="0.85"/>
</svg>
